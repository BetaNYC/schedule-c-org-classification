project:
  type: website
  resources: images
  output-dir: docs
  # Builds whats-changed.qmd from WHATS-CHANGED.md before every render.
  pre-render: python3 scripts/whats_changed.py render WHATS-CHANGED.md --format quarto --out whats-changed.qmd --site-prefix docs/ --repo-url https://github.com/BetaNYC/schedule-c-org-classification

website:
  navbar: false

format:
  html:
    theme:
      - cosmo
      - brand
    css:
      - style/cil-theme.css
    toc: false
    include-before-body: radar-header.html
    include-after-body: radar-footer.html
    fig-format: svg
    fig-dpi: 300
    fig-width: 12
    fig-asp: 0.618
execute:
  freeze: false